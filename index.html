<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Industrialpedia</title>
    <style>
      html,body{margin:0;min-height:100%;background:#070b12}
      body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #ip-boot{min-height:100vh;box-sizing:border-box;padding:18px;color:#eef4fb}
      .ip-boot-header{display:flex;align-items:center;gap:12px;height:44px}
      .ip-boot-mark{width:36px;height:36px;border-radius:12px;border:1px solid rgba(90,156,217,.4);background:rgba(90,156,217,.1);display:flex;align-items:center;justify-content:center}
      .ip-boot-dot{width:8px;height:8px;border-radius:999px;background:#5a9cd9;box-shadow:0 0 14px rgba(90,156,217,.8)}
      .ip-boot-brand{letter-spacing:.18em;font-size:14px;font-weight:600}
      .ip-boot-hero{max-width:760px;margin:42px auto 0;text-align:center}
      .ip-boot-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(90,156,217,.2);border-radius:999px;color:#9aa9ba;font-size:10px;letter-spacing:.16em;text-transform:uppercase}
      .ip-boot-title{margin:20px 0 12px;font-size:clamp(34px,8vw,64px);line-height:1;letter-spacing:-.045em;font-weight:800}
      .ip-boot-accent{color:#5a9cd9}
      .ip-boot-subtitle{color:#9aa9ba;font-size:15px;line-height:1.6;margin:0 auto;max-width:520px}
      .ip-boot-search{height:58px;max-width:620px;margin:28px auto 0;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.025)}
    </style>
  </head>
  <body>
    <div id="root">
      <div id="ip-boot" aria-hidden="true">
        <div class="ip-boot-header">
          <div class="ip-boot-mark"><div class="ip-boot-dot"></div></div>
          <div class="ip-boot-brand">INDUSTRIALPEDIA</div>
        </div>
        <div class="ip-boot-hero">
          <div class="ip-boot-pill"><span class="ip-boot-dot"></span> Cargando Industrialpedia</div>
          <div class="ip-boot-title">Encuentra tu <span class="ip-boot-accent">refacción</span> en segundos.</div>
          <p class="ip-boot-subtitle">Escribe una refacción industrial para buscarla.</p>
          <div class="ip-boot-search"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
